# Daily: test the site, then republish the preview (past shows drop off, the Now line moves) to gh-pages.
name: daily
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the preview push to gh-pages uses the job token
    steps:
      # the publish step pushes with GITHUB_TOKEN from env (tools/preview.mjs), so the checkout need not keep credentials
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tools/preview.mjs --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
  # Rebuild the live host after the daily tests pass. Inert until the owner adds the RENDER_DEPLOY_HOOK repo secret.
  deploy:
    needs: daily
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Trigger the host rebuild
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "RENDER_DEPLOY_HOOK not set, skipping"; fi
